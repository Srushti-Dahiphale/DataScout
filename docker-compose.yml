services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: datascout
      POSTGRES_PASSWORD: datascout
      POSTGRES_DB: datascout
    ports:
      - "5432:5432"
    volumes:
      - datascout-postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - datascout-redis:/data

volumes:
  datascout-postgres:
  datascout-redis: